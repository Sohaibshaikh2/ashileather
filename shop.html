<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | ASHI LEATHER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- GSAP & ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <!-- Lenis Smooth Scroll -->
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Syne', 'sans-serif'],
                    },
                    colors: {
                        'neutral-950': '#1b110a',
                        'neutral-900': '#2c1e16',
                        'gray-200': '#e5d3c8',
                        'gray-300': '#d1b8a8',
                        'gray-400': '#b49581',
                        'gray-500': '#966a4f',
                        'gray-700': '#523422',
                        'white': '#fdfbf7',
                        'black': '#0d0806'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #1b110a;
            color: #fdfbf7;
            cursor: none;
            overflow-x: hidden;
        }

        .no-scroll { overflow: hidden !important; }

        .noise-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 9998; opacity: 0.04;
            background-image: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
        }

        #preloader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0d0806; z-index: 10000;
            display: flex; justify-content: center; align-items: center;
        }

        .text-4xl { font-size: 2rem !important; line-height: 2.5rem; }

        .cursor-dot, .cursor-outline {
            position: fixed; top: 0; left: 0; transform: translate(-50%, -50%);
            border-radius: 50%; z-index: 9999; pointer-events: none;
        }
        .cursor-dot { width: 6px; height: 6px; background-color: #fdfbf7; }
        .cursor-outline {
            width: 40px; height: 40px; border: 1px solid rgba(253, 251, 247, 0.3);
            transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), height 0.3s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.3s ease;
        }
        .cursor-active .cursor-outline {
            width: 70px; height: 70px; background-color: rgba(253, 251, 247, 0.05);
            border-color: rgba(253, 251, 247, 0.8); backdrop-filter: blur(4px);
        }

        ::-webkit-scrollbar { display: none; }

        .filter-checkbox { display: none; }
        .filter-label {
            display: flex; align-items: center; gap: 10px; cursor: pointer;
            font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: #b49581;
            transition: color 0.3s ease;
        }
        .filter-label:hover { color: #fdfbf7; }
        .filter-box {
            width: 16px; height: 16px; border: 1px solid #523422; border-radius: 2px;
            display: flex; justify-content: center; align-items: center; transition: all 0.3s ease;
        }
        .filter-checkbox:checked + .filter-label .filter-box {
            background-color: #fdfbf7; border-color: #fdfbf7;
        }
        .filter-checkbox:checked + .filter-label { color: #fdfbf7; }
    </style>
</head>
<body class="antialiased selection:bg-gray-400 selection:text-black no-scroll">

    <div id="preloader">
        <h2 class="font-display font-bold text-2xl tracking-[0.3em] text-white overflow-hidden">
            <span class="inline-block transform translate-y-full preloader-text">ASHI LEATHER.</span>
        </h2>
    </div>

    <div class="noise-bg"></div>
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <nav id="main-nav" class="fixed top-0 left-0 w-full z-50 px-6 py-4 border-b border-white/5 bg-neutral-950/90 backdrop-blur-md flex justify-between items-center transition-all duration-700 pointer-events-none">
        <a href="index.html" class="font-display font-bold text-2xl tracking-tighter pointer-events-auto hover-target magnetic relative p-2">ASHI LEATHER.</a>
        <div class="hidden md:flex gap-8 text-sm uppercase tracking-widest font-medium pointer-events-auto">
            <a href="index.html" class="hover-target magnetic p-2 relative after:absolute after:bottom-0 after:left-0 after:h-[1px] after:w-0 after:bg-white after:transition-all hover:after:w-full">Home</a>
            <a href="#" class="text-white border-b border-white hover-target magnetic p-2">Shop</a>
        </div>
    </nav>

    <header class="pt-40 pb-20 px-6 md:px-12 lg:px-24 bg-neutral-950 text-center border-b border-white/5">
        <h1 class="font-display font-bold text-4xl md:text-6xl uppercase tracking-tighter text-white gs-reveal">The Archive</h1>
        <p class="text-gray-400 text-sm tracking-[0.2em] uppercase mt-4 gs-reveal">Complete Collection</p>
    </header>

    <section class="py-16 px-6 md:px-12 lg:px-24 bg-neutral-900 flex flex-col lg:flex-row gap-16 min-h-screen">
        
        <!-- Sidebar / Dynamic Filters -->
        <aside class="w-full lg:w-1/4 pointer-events-auto gs-reveal">
            <div class="sticky top-32">
                <div class="flex justify-between items-center mb-8 pb-4 border-b border-white/10">
                    <h3 class="font-display font-bold uppercase tracking-widest text-lg">Filters</h3>
                    <button id="reset-filters" class="text-xs uppercase tracking-widest text-gray-500 hover:text-white transition-colors hover-target">Reset</button>
                </div>

                <div class="mb-8">
                    <h4 class="text-sm font-semibold uppercase tracking-widest text-white mb-4">Size</h4>
                    <div id="filter-size-container" class="flex flex-col gap-3">
                        <!-- Loaded dynamically -->
                    </div>
                </div>

                <div class="mb-8">
                    <h4 class="text-sm font-semibold uppercase tracking-widest text-white mb-4">Finish</h4>
                    <div id="filter-finish-container" class="flex flex-col gap-3">
                        <!-- Loaded dynamically -->
                    </div>
                </div>

                <div class="mb-8">
                    <h4 class="text-sm font-semibold uppercase tracking-widest text-white mb-4">Color</h4>
                    <div id="filter-color-container" class="flex flex-col gap-3">
                        <!-- Loaded dynamically -->
                    </div>
                </div>

                <div class="mb-8">
                    <h4 class="text-sm font-semibold uppercase tracking-widest text-white mb-4">Material</h4>
                    <div id="filter-material-container" class="flex flex-col gap-3">
                        <!-- Loaded dynamically -->
                    </div>
                </div>
            </div>
        </aside>

        <!-- Product Grid -->
        <main class="w-full lg:w-3/4">
            <div id="no-products-msg" class="hidden text-center py-20 text-gray-400 uppercase tracking-widest text-sm">
                No items match your selection.
            </div>
            
            <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-10">
                <!-- Products loaded dynamically -->
            </div>
        </main>
    </section>

    <footer class="py-24 px-6 md:px-12 lg:px-24 border-t border-white/5 bg-neutral-950">
        <div class="flex flex-col md:flex-row justify-between items-center gap-10">
            <div class="text-center md:text-left">
                <h2 class="font-display font-bold text-3xl tracking-tighter mb-4 text-white">ASHI LEATHER.</h2>
                <p class="text-gray-500 text-sm tracking-[0.2em] uppercase">Uncompromising quality since 2024.</p>
            </div>
            <div class="flex gap-8 text-xs uppercase tracking-widest font-medium pointer-events-auto">
                <a href="#" class="text-gray-400 hover:text-white transition-colors hover-target">Instagram</a>
                <a href="#" class="text-gray-400 hover:text-white transition-colors hover-target">Twitter</a>
                <a href="#" class="text-gray-400 hover:text-white transition-colors hover-target">Contact</a>
            </div>
        </div>
    </footer>

    <script>
        // --- 1. Initialize Lenis Smooth Scroll ---
        const lenis = new Lenis({
            duration: 1.5,
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
            direction: 'vertical',
            gestureDirection: 'vertical',
            smooth: true,
        });
        lenis.on('scroll', ScrollTrigger.update);
        gsap.ticker.add((time) => { lenis.raf(time * 1000); });
        gsap.ticker.lagSmoothing(0, 0);

        // --- 2. Custom Cursor Logic ---
        const cursorDot = document.querySelector('.cursor-dot');
        const cursorOutline = document.querySelector('.cursor-outline');
        
        window.addEventListener('mousemove', (e) => {
            gsap.set(cursorDot, { x: e.clientX, y: e.clientY });
            gsap.to(cursorOutline, { x: e.clientX, y: e.clientY, duration: 0.2, ease: "power2.out" });
        });

        function attachCursorEvents() {
            const hoverTargets = document.querySelectorAll('.hover-target, .filter-label');
            hoverTargets.forEach(target => {
                // Ensure event is not attached multiple times
                target.removeEventListener('mouseenter', addCursorHover);
                target.removeEventListener('mouseleave', removeCursorHover);
                target.addEventListener('mouseenter', addCursorHover);
                target.addEventListener('mouseleave', removeCursorHover);
            });
        }
        function addCursorHover() { document.body.classList.add('cursor-active'); }
        function removeCursorHover() { document.body.classList.remove('cursor-active'); }

        // --- 3. Dynamic Filtering System ---
        const noProductsMsg = document.getElementById('no-products-msg');
        const resetBtn = document.getElementById('reset-filters');

        function attachFilterEvents() {
            const checkboxes = document.querySelectorAll('.filter-checkbox');
            checkboxes.forEach(cb => {
                cb.removeEventListener('change', filterProducts);
                cb.addEventListener('change', filterProducts);
            });
        }

        function filterProducts() {
            const products = document.querySelectorAll('.product-item');
            const filters = {
                size: Array.from(document.querySelectorAll('input[data-filter="size"]:checked')).map(cb => cb.value),
                finish: Array.from(document.querySelectorAll('input[data-filter="finish"]:checked')).map(cb => cb.value),
                color: Array.from(document.querySelectorAll('input[data-filter="color"]:checked')).map(cb => cb.value),
                material: Array.from(document.querySelectorAll('input[data-filter="material"]:checked')).map(cb => cb.value),
            };

            let visibleCount = 0;

            products.forEach(product => {
                const pSizes = product.dataset.size ? product.dataset.size.split(',') : [];
                const pFinishes = product.dataset.finish ? product.dataset.finish.split(',') : [];
                const pColors = product.dataset.color ? product.dataset.color.split(',') : [];
                const pMaterials = product.dataset.material ? product.dataset.material.split(',') : [];

                const matchSize = filters.size.length === 0 || filters.size.some(s => pSizes.includes(s));
                const matchFinish = filters.finish.length === 0 || filters.finish.some(f => pFinishes.includes(f));
                const matchColor = filters.color.length === 0 || filters.color.some(c => pColors.includes(c));
                const matchMaterial = filters.material.length === 0 || filters.material.some(m => pMaterials.includes(m));

                if (matchSize && matchFinish && matchColor && matchMaterial) {
                    product.style.display = 'block';
                    gsap.to(product, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" });
                    visibleCount++;
                } else {
                    gsap.to(product, { opacity: 0, scale: 0.95, duration: 0.3, ease: "power2.out", onComplete: () => {
                        product.style.display = 'none';
                    }});
                }
            });

            if (visibleCount === 0 && products.length > 0) {
                noProductsMsg.classList.remove('hidden');
            } else {
                noProductsMsg.classList.add('hidden');
            }
            
            setTimeout(() => { ScrollTrigger.refresh(); }, 400);
        }

        resetBtn.addEventListener('click', () => {
            document.querySelectorAll('.filter-checkbox').forEach(cb => cb.checked = false);
            filterProducts();
        });

        // --- 4. Fetch Dynamic Attributes (Filters) ---
        async function loadFilters() {
            try {
                const response = await fetch('http://localhost:8000/api/attributes');
                const result = await response.json();

                if (result.success) {
                    const data = result.data;
                    
                    // Render Sizes (Uses Abbreviation for value)
                    document.getElementById('filter-size-container').innerHTML = data.sizes.map(s => `
                        <input type="checkbox" id="size-${s.id}" class="filter-checkbox" value="${s.abriviation}" data-filter="size">
                        <label for="size-${s.id}" class="filter-label hover-target"><div class="filter-box"></div> ${s.name} (${s.abriviation})</label>
                    `).join('');

                    // Render Finishes
                    document.getElementById('filter-finish-container').innerHTML = data.finishes.map(f => `
                        <input type="checkbox" id="finish-${f.id}" class="filter-checkbox" value="${f.name}" data-filter="finish">
                        <label for="finish-${f.id}" class="filter-label hover-target"><div class="filter-box"></div> ${f.name}</label>
                    `).join('');

                    // Render Colors
                    document.getElementById('filter-color-container').innerHTML = data.colors.map(c => `
                        <input type="checkbox" id="color-${c.id}" class="filter-checkbox" value="${c.name}" data-filter="color">
                        <label for="color-${c.id}" class="filter-label hover-target"><div class="filter-box"></div> ${c.name}</label>
                    `).join('');

                    // Render Materials
                    document.getElementById('filter-material-container').innerHTML = data.materials.map(m => `
                        <input type="checkbox" id="mat-${m.id}" class="filter-checkbox" value="${m.name}" data-filter="material">
                        <label for="mat-${m.id}" class="filter-label hover-target"><div class="filter-box"></div> ${m.name}</label>
                    `).join('');

                    attachFilterEvents();
                    attachCursorEvents();
                }
            } catch (error) {
                console.error('Filters API Load Error:', error);
            }
        }

        // --- 5. Fetch Dynamic Products ---
        async function loadProducts() {
            try {
                const response = await fetch('http://localhost:8000/api/products');
                const result = await response.json();

                if (result.success && result.data && result.data.length > 0) {
                    const grid = document.getElementById('product-grid');
                    grid.innerHTML = ''; 

                    result.data.forEach(product => {
                        const imgUrl = (product.images && product.images.length > 0) 
                            ? `http://localhost:8000${product.images[0].url}` 
                            : 'https://images.unsplash.com/photo-1551028719-00167b16eac5?w=500&q=80';

                        const price = parseFloat(product.discount_price) > 0 ? product.discount_price : product.price;
                        
                        const sizeData = product.sizes ? product.sizes.join(',') : '';
                        const finishData = product.finishes ? product.finishes.join(',') : '';
                        const colorData = product.colors ? product.colors.join(',') : '';
                        const materialData = product.materials ? product.materials.join(',') : '';

                        const detailsText = [
                            product.colors[0] || 'Unknown', 
                            product.finishes[0] || 'Standard', 
                            product.materials[0] || 'Leather'
                        ].join(' / ');

                        const cardHtml = `
                        <div class="product-item product-card group cursor-pointer hover-target pointer-events-auto" 
                             data-size="${sizeData}" 
                             data-finish="${finishData}" 
                             data-color="${colorData}" 
                             data-material="${materialData}"
                             style="opacity: 0; transform: translateY(40px);">
                            <div class="relative overflow-hidden aspect-[3/4] bg-neutral-950 rounded-sm">
                                <img src="${imgUrl}" alt="${product.name}" class="object-cover w-full h-full transition-transform duration-1000 group-hover:scale-110 opacity-90 group-hover:opacity-100" />
                                <div class="absolute bottom-0 left-0 w-full p-4 bg-gradient-to-t from-black/90 to-transparent translate-y-full group-hover:translate-y-0 transition-transform duration-500">
                                    <button class="whatsapp-btn w-full py-4 bg-white text-black font-semibold uppercase text-xs tracking-[0.2em] hover:bg-gray-200 transition-colors flex items-center justify-center gap-3">
                                        Order via WhatsApp
                                    </button>
                                </div>
                            </div>
                            <div class="mt-6 flex justify-between items-start">
                                <div>
                                    <h4 class="product-title font-display font-bold text-lg uppercase tracking-tight">${product.name}</h4>
                                    <p class="text-gray-500 text-xs tracking-widest uppercase mt-1">${detailsText}</p>
                                </div>
                                <span class="product-price font-medium">Rs. ${parseFloat(price).toLocaleString()}</span>
                            </div>
                        </div>
                        `;
                        grid.insertAdjacentHTML('beforeend', cardHtml);
                    });

                    attachCursorEvents();
                    attachWhatsAppEvents();
                    
                    gsap.to('.product-item', { 
                        opacity: 1, 
                        y: 0, 
                        duration: 1, 
                        stagger: 0.1, 
                        ease: "expo.out",
                        onComplete: filterProducts 
                    });
                    
                } else {
                    document.getElementById('product-grid').innerHTML = '<p class="text-gray-400">No products available at the moment.</p>';
                }
            } catch (error) {
                console.error('Products API Load Error:', error);
            }
        }

        function attachWhatsAppEvents() {
            document.querySelectorAll('.whatsapp-btn').forEach(btn => {
                btn.replaceWith(btn.cloneNode(true));
            });

            document.querySelectorAll('.whatsapp-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation(); 
                    
                    const card = btn.closest('.product-card');
                    const titleElement = card.querySelector('.product-title');
                    const priceElement = card.querySelector('.product-price');
                    
                    if (titleElement && priceElement) {
                        const title = titleElement.innerText.trim();
                        const price = priceElement.innerText.trim();
                        const phoneNumber = "923122933457";
                        const message = `Hi, I am interested in purchasing ${title} priced at ${price}. Please provide more details.`;
                        
                        const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
                        window.open(whatsappUrl, '_blank');
                    }
                });
            });
        }

        // --- 6. Initialization Sequence ---
        window.addEventListener("load", () => {
            // Initiate API calls immediately
            loadFilters();

            const tl = gsap.timeline();
            tl.to('.preloader-text', { y: '0%', duration: 1, ease: 'expo.out' })
              .to('#preloader', { y: '-100%', duration: 1.2, ease: 'expo.inOut', delay: 0.5, onComplete: () => {
                  document.body.classList.remove('no-scroll');
                  ScrollTrigger.refresh();
                  // Load products after preloader hides
                  loadProducts();
              }})
              .from(".gs-reveal", { 
                  y: 40, 
                  opacity: 0, 
                  duration: 1.2, 
                  stagger: 0.1, 
                  ease: "expo.out",
                  clearProps: "all" 
              }, "-=0.5");
        });

    </script>
</body>
</html>
